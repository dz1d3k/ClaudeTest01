<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Moje Słowa</title>
  <meta name="description" content="Prosta aplikacja AAC – obrazki, które mówią po polsku.">
  <meta name="theme-color" content="#FFF8E7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Moje Słowa">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="top">
  <header class="bar">
    <button id="back" class="bar-btn" aria-label="Wstecz">⬅️</button>
    <button id="home" class="bar-btn" aria-label="Start">🏠</button>
    <h1 id="title">Moje Słowa</h1>
    <button id="favs" class="bar-btn" aria-label="Ulubione">⭐</button>
  </header>

  <button id="spoken" class="spoken" aria-label="Powtórz"><span id="spoken-text">🔊</span></button>
  </div>

  <main id="list" class="list"></main>

  <dialog id="settings">
    <form method="dialog" class="settings">
      <h2>⚙️ Ustawienia głosu</h2>
      <label>Głos
        <select id="voice"></select>
      </label>
      <p id="voice-hint" class="hint"></p>
      <label>Tempo mowy: <span id="rate-value"></span>
        <input id="rate" type="range" min="0.5" max="1.3" step="0.05">
      </label>
      <div class="settings-actions">
        <button type="button" id="test-voice">🔊 Test</button>
        <button value="close">Gotowe</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
