name: Build Moje Słowa (Android)

on:
  push:
    paths:
      - "aac-app/**"
      - ".github/workflows/aac-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aac-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moje-slowa-apk
          path: aac-app/app/build/outputs/apk/debug/*.apk
